<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary SEO (dynamic overrides applied by SEOMeta.tsx) ── -->
    <title>NovaMart | Ghana's Premier Online Superstore &amp; Marketplace</title>
    <meta name="description" content="Shop electronics, phones, home appliances, fashion, beauty, perfumes, and groceries online at NovaMart Ghana. Fast nationwide delivery &amp; secure mobile money checkout." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#059669" />

    <!-- ── Open Graph ── -->
    <meta property="og:title" content="NovaMart | Ghana's Premier Online Superstore &amp; Marketplace" />
    <meta property="og:description" content="Shop electronics, phones, home appliances, fashion, beauty, perfumes, and groceries online at NovaMart Ghana. Fast nationwide delivery &amp; secure mobile money checkout." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NovaMart Ghana" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&auto=format&fit=crop&q=80" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@novamartgh" />
    <meta name="twitter:title" content="NovaMart | Ghana's Premier Online Superstore" />
    <meta name="twitter:description" content="Shop online at NovaMart Ghana — fast delivery &amp; secure MoMo / card checkout." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&auto=format&fit=crop&q=80" />

    <!-- ── PWA ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NovaMart" />
    <!-- Apple touch icon (inline SVG as data URI so no extra file needed) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23059669'/><path d='M45 68 40 52h100L128 166H52L45 68z' fill='none' stroke='white' stroke-width='10' stroke-linejoin='round'/><path d='M70 108a25 25 0 1 0 50 0' fill='none' stroke='white' stroke-width='10'/></svg>" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z'/><path d='M3 6h18'/><path d='M16 10a4 4 0 0 1-8 0'/></svg>" />

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />

    <!-- ── Dark mode flash prevention ── -->
    <!-- Reads localStorage BEFORE React hydrates to avoid white flash on dark mode -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('novamart_dark_mode');
          if (dark === 'true' || (dark === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Service Worker Registration ── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[NovaMart SW] Registered, scope:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[NovaMart SW] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
